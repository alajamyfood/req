<style>
:root {
  --turquoise-dark: #006d77;
  --turquoise-medium: #119da4;
  --turquoise-light: #83c5be;
  --turquoise-pale: #e0f7f4;
  --text-dark: #0d1f1f;
  --blur-bg: rgba(255,255,255,0.94);
  --border: #a0d4cf;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Tajawal',sans-serif;
  background: linear-gradient(to bottom, var(--turquoise-dark), var(--turquoise-pale));
  background-attachment: fixed;
  color: var(--text-dark);
  padding: 10px 8px;
}
.container {
  background: var(--blur-bg);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 24px 20px;
  max-width: 720px;
  margin: 20px auto;
  box-shadow: 0 10px 35px rgba(0,109,119,.25);
  border: 1px solid rgba(131,197,190,0.3);
}
.header { text-align:center; margin-bottom:24px; }
.logo-img { max-width:320px; width:100%; margin:auto; display:block; }
h2 { text-align:center; color:var(--turquoise-dark); margin-bottom:24px; font-size:1.9rem; }
.form-group { margin-bottom:20px; }
label { display:block; margin-bottom:8px; font-weight:600; font-size:1.05rem; }
input, select, textarea {
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:1.05rem;
}
input::placeholder, textarea::placeholder {
  color: #666 !important;
  opacity: 0.9;
}
table { width:100%; margin:12px 0 20px; }
th, td { padding:12px 10px; text-align:right; border-bottom:1px solid #eee; }
th { background:rgba(17,157,164,0.08); }
.remove-btn {
  background:#e74c3c;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}
.add-btn {
  background:var(--turquoise-medium);
  color:#fff;
  border:none;
  padding:18px 14px;
  border-radius:10px;
  cursor:pointer;
  width:100%;
  margin-top:12px;
  font-size:1.25rem;
  font-weight:600;
}
button[type="submit"] {
  width:100%;
  padding:16px;
  margin-top:24px;
  font-size:1.2rem;
  font-weight:700;
  background:linear-gradient(90deg,var(--turquoise-medium),var(--turquoise-light));
  color:#fff;
  border:none;
  border-radius:12px;
  cursor:pointer;
}
.loading {
  pointer-events:none;
  opacity:0.85;
}
.loading::after {
  content:'';
  display:inline-block;
  width:1.1em;
  height:1.1em;
  margin-left:0.6em;
  vertical-align:middle;
  border:3px solid white;
  border-top-color:transparent;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.note {
  text-align:center;
  font-size:.95rem;
  color:#444;
  margin-top:12px;
}
.note a {
  color:var(--turquoise-dark);
  font-weight:700;
  text-decoration:none;
}
.note a:hover { text-decoration:underline; }

/* صندوق وزن الطلبية */
.weight-box {
  background: linear-gradient(135deg, #e0f7f4, #ffffff);
  border: 2px solid var(--turquoise-medium);
  border-radius: 14px;
  padding: 16px 18px;
  margin: 18px 0 10px;
  text-align: center;
  transition: all 0.3s ease;
}
.weight-box.over-limit {
  border-color: #e67e22;
  background: linear-gradient(135deg, #fff3e0, #ffffff);
  box-shadow: 0 0 0 3px rgba(230,126,34,0.15);
}
.weight-title {
  font-weight: 700;
  color: var(--turquoise-dark);
  margin-bottom: 6px;
  font-size: 1.05rem;
}
.weight-value {
  font-size: 1.85rem;
  font-weight: 700;
  color: var(--turquoise-dark);
  margin: 4px 0;
}
.weight-box.over-limit .weight-value {
  color: #e67e22;
}
.weight-status {
  font-size: 1.05rem;
  font-weight: 600;
  margin-top: 10px;
  line-height: 1.5;
}
.weight-limit {
  font-size: 0.88rem;
  color: #666;
  margin-top: 8px;
}

#reviewModal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  z-index:1000;
  align-items:center;
  justify-content:center;
  font-family:'Tajawal',sans-serif;
}
#reviewModal .modal-content {
  background:white;

  max-height:85vh;

}

}
#reviewModal pre {

  font-family:'Tajawal',monospace;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:1.05rem;
  line-height:1.6;

}
#reviewModal .buttons {
  display:flex;

  justify-content:center;

}
#reviewModal button {

  min-width:220px;

#reviewModal .main-btn {
  background:linear-gradient(90deg,#119da4,#83c5be);
  color:white;
}
#reviewModal .cancel-btn {

  color:#333;
}
@media (max-width:580px) {
  table { border-collapse:separate; border-spacing:0 18px; }
  thead { display:none; }
  tbody,tr,td { display:block; width:100%; }
  tr {

    border-radius:14px;
    background:white;

    padding:14px;
  }
  td { border:none; padding:6px 0; }
  .remove-btn { width:100%; margin-top:6px; }
}
</style>

<script>
const productWeights = {
  "001 عجمي حمص بالطحينة 230غ": "230 غرام",
  "002 عجمي كريم الثوم 230غ": "230 غرام",
  "003 عجمي متبل 230غ": "230 غرام",
  "004 عجمي حمص 450غ": "علبة 450 غرام",
  "005 عجمي حمص 300غ": "علبة 300 غرام",
  "006 عجمي حمص 225غ": "علبة 225 غرام",
  "007 عجمي كريم الثوم 225غ": "علبة 225 غرام",
  "008 عجمي متبل 450غ": "علبة 450 غرام",
  "009 عجمي متبل 225غ": "علبة 225 غرام",
  "010 زاد العربي حمص بالطحينة 230غ": "230 غرام",
  "011 زاد العربي كريم الثوم 230غ": "230 غرام",
  "012 زاد العربي متبل 230غ": "230 غرام",
  "013 الحمصاني حمص 230غ": "230 غرام",
  "014 الحمصاني كريم الثوم 230غ": "230 غرام",
  "015 الخال حمص 230غ": "230 غرام",
  "016 الخال كريم الثوم 230غ": "230 غرام",
  "017 الخال متبل 230غ": "230 غرام",
  "018 عجمي حمص بالكيلو": "كيلو غرام",
  "019 الحمصاني حمص بالكيلو": "كيلو غرام",
  "020 زاد العربي كريم الثوم بالكيلو": "كيلو غرام",
  "021 الحمصاني كريم الثوم بالكيلو": "كيلو غرام",
  "022 الخال كريم الثوم بالكيلو": "كيلو غرام",
  "023 MNZ كريم الثوم بالكيلو": "كيلو غرام",
  "024 عجمي متبل بالكيلو": "كيلو غرام",
  "025 حمص خام أسبتيك 20 كغ": "20 كغ",
  "026 2750غ عجمي لبنة": "2750 غرام",
  "027 900غ عجمي لبنة": "900 غرام",
  "028 أبو عبدو حمص 300غ": "علبة 300 غرام"
};

const PALLET_MAX_KG = 619;
let rowCounter = 0;

function isDuplicate(v, c) {
  return [...document.querySelectorAll('[name^="product_"]')]
    .filter(i => i !== c && i.value.trim() !== "")
    .some(i => i.value.trim() === v);
}

/** تحويل نص الوزن إلى كيلوغرام */
/** تحويل نص الوزن إلى كيلوغرام */
function parseWeightToKg(weightStr) {
  if (!weightStr) return 0;
  const s = weightStr.trim().toLowerCase().replace(/,/g, '.');

  // استخراج أول رقم موجود في النص (حتى لو بدأ بـ "علبة")
  const match = s.match(/[\d.]+/);
  const num = match ? parseFloat(match[0]) : NaN;

  // كيلو / كغ
  if (s.includes('كغ') || s.includes('كيلو')) {
    return isNaN(num) ? 1 : num;   // "كيلو غرام" بدون رقم = 1 كغ
  }

  // غرام
  if (s.includes('غرام') || s.includes('غ')) {
    return isNaN(num) ? 0 : num / 1000;
  }

  // رقم فقط → نفترض كيلوغرام
  return isNaN(num) ? 0 : num;
}

/** صياغة نص عدد الطبالي بالعربية */
function getPalletText(count) {
  if (count <= 0) return '';
  if (count === 1) return 'طبلية واحدة';
  if (count === 2) return 'طبليتين';
  return count + ' طبالي';
}

/** حساب الوزن الكلي + عدد الطبالي وعرضها */
function updateTotalWeight() {
  let totalKg = 0;

  document.querySelectorAll('#itemsBody tr').forEach(row => {
    const qty = parseFloat(row.querySelector('[name^="quantity_"]')?.value) || 0;
    const wgt = row.querySelector('[name^="weight_"]')?.value || '';
    totalKg += qty * parseWeightToKg(wgt);
  });

  const box = document.getElementById('totalWeightBox');
  const valueEl = document.getElementById('totalWeightValue');
  const statusEl = document.getElementById('weightStatus');

  valueEl.textContent = totalKg.toFixed(2) + ' كغ';

  if (totalKg <= 0) {
    box.classList.remove('over-limit');
    statusEl.textContent = 'أضف منتجات لحساب الوزن وعدد الطبالي';
    statusEl.style.color = '#666';
    return;
  }

  const pallets = Math.ceil(totalKg / PALLET_MAX_KG);
  const palletText = getPalletText(pallets);

  if (pallets === 1) {
    box.classList.remove('over-limit');
    statusEl.innerHTML = `الطلبية سوف تتم على <strong>${palletText}</strong>`;
    statusEl.style.color = '#2e7d32';
  } else {
    box.classList.add('over-limit');
    statusEl.innerHTML = `الطلبية سوف تتوزع على <strong>${palletText}</strong>`;
    statusEl.style.color = '#e65100';
  }
}

function getDefaultWeightSelect(id, selectedValue = '') {
  const options = [
    '230 غرام',
    '450 غرام',
    '300 غرام',
    '225 غرام',
    'كيلو غرام',
    '2750 غرام',
    '900 غرام',
    '20 كغ'
  ];

  let html = `<select name="weight_${id}" class="weight-select">`;
  if (!selectedValue) {
    html += `<option value="" disabled selected hidden>الوزن</option>`;
  }
  options.forEach(opt => {
    const sel = (opt === selectedValue) ? ' selected' : '';
    html += `<option value="${opt}"${sel}>${opt}</option>`;
  });
  // إذا كان الوزن المختار غير موجود في القائمة نضيفه
  if (selectedValue && !options.includes(selectedValue)) {
    html += `<option value="${selectedValue}" selected>${selectedValue}</option>`;
  }
  html += `</select>`;
  return html;
}

function addRow() {
  const id = rowCounter++;
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <input list="product-list" name="product_${id}" placeholder="اختر أو اكتب اسم المنتج" required>
    </td>
    <td>
      <input type="number" name="quantity_${id}" min="1" step="1" placeholder="الكمية" required>
    </td>
    <td class="weight-cell" id="weight-cell-${id}">
      ${getDefaultWeightSelect(id)}
    </td>
    <td>
      <button type="button" class="remove-btn" onclick="this.closest('tr').remove(); updateTotalWeight();">حذف</button>
    </td>
  `;
  document.getElementById('itemsBody').appendChild(tr);

  const productInput = tr.querySelector(`[name="product_${id}"]`);
  const qtyInput = tr.querySelector(`[name="quantity_${id}"]`);
  const weightCell = tr.querySelector(`#weight-cell-${id}`);

  // تحديث الوزن عند تغيير الكمية
  qtyInput.addEventListener('input', updateTotalWeight);

  // تحديث الوزن عند تغيير الـ select أو الـ input داخل خلية الوزن
  weightCell.addEventListener('change', updateTotalWeight);
  weightCell.addEventListener('input', updateTotalWeight);

  productInput.addEventListener('input', function() {
    const val = this.value.trim();

    if (val === '') {
      weightCell.innerHTML = getDefaultWeightSelect(id);
      updateTotalWeight();
      return;
    }

    if (isDuplicate(val, this)) {
      alert('هذا الصنف مضاف مسبقاً!');
      this.value = '';
      weightCell.innerHTML = getDefaultWeightSelect(id);
      updateTotalWeight();
      return;
    }

    const expectedWeight = productWeights[val];
    if (expectedWeight) {
      weightCell.innerHTML = getDefaultWeightSelect(id, expectedWeight);
    } else {
      weightCell.innerHTML = `
        <input type="text" name="weight_${id}" placeholder="اكتب الوزن (مثال: 400 غرام)" required>
      `;
    }
    updateTotalWeight();
  });
}

function getOrderSummaryForDisplay() {
  const rows = document.querySelectorAll('#itemsBody tr');
  let summary = `عدد الأصناف: ${rows.length}\n───────────────\n\n`;
  let i = 1;
  let totalKg = 0;

  rows.forEach(row => {
    const prod = row.querySelector('[name^="product_"]')?.value.trim();
    const qty = row.querySelector('[name^="quantity_"]')?.value;
    const wgt = row.querySelector('[name^="weight_"]')?.value;
    if (prod) {
      summary += `${i}. ${prod}\n`;
      summary += `الكمية: ${qty}\n`;
      if (wgt) summary += `الوزن: ${wgt}\n`;
      summary += '\n';
      i++;
      totalKg += (parseFloat(qty) || 0) * parseWeightToKg(wgt);
    }
  });

  const pallets = Math.ceil(totalKg / PALLET_MAX_KG);
  summary += `───────────────\n`;
  summary += `وزن الطلبية الإجمالي: ${totalKg.toFixed(2)} كغ\n`;
  if (pallets > 0) {
    summary += `عدد الطبالي: ${getPalletText(pallets)}\n`;
  }

  return summary.trim();
}

function buildWhatsAppMessage() {
  const today = new Date();

  const weekdays = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const weekday = weekdays[today.getDay()];

  const day = today.getDate();
  const monthNum = String(today.getMonth() + 1).padStart(2, '0');
  const year = today.getFullYear();
  const hours = today.getHours() % 12 || 12;
  const minutes = String(today.getMinutes()).padStart(2, '0');
  const period = today.getHours() >= 12 ? 'م' : 'ص';

  const dateTimeStr = `${weekday}، ${day}/${monthNum}/${year} • الساعة ${hours}:${minutes} ${period}`;

  const gov = document.querySelector('[name="governorate"]').value.trim() || 'غير محدد';
  const name = document.querySelector('[name="customerName"]').value.trim() || 'غير محدد';
  const notes = document.querySelector('[name="notes"]').value.trim();

  let msg = `*طلب جديد - منتجات العجمي* 📦\n`;
  msg += `📅 ${dateTimeStr}\n\n`;
  msg += `📍 المحافظة: ${gov}\n`;
  msg += `👤 الزبون: ${name}\n\n`;
  msg += `*المنتجات:*\n`;

  const rows = document.querySelectorAll('#itemsBody tr');
  let idx = 1;
  let totalKg = 0;

  rows.forEach(r => {
    const p = r.querySelector('[name^="product_"]')?.value.trim();
    const q = r.querySelector('[name^="quantity_"]')?.value;
    const w = r.querySelector('[name^="weight_"]')?.value;
    if (p) {
      msg += `${idx}. ${p}\n`;
      if (w) msg += `وزن المنتج: ${w}\n`;
      msg += `الكمية: ${q}\n\n`;
      idx++;
      totalKg += (parseFloat(q) || 0) * parseWeightToKg(w);
    }
  });

  const pallets = Math.ceil(totalKg / PALLET_MAX_KG);

  msg += `*ملخص الوزن:*\n`;
  msg += `الوزن الإجمالي: ${totalKg.toFixed(2)} كغ\n`;
  if (pallets > 0) {
    msg += `عدد الطبالي: ${getPalletText(pallets)}\n`;
  }
  msg += `\n`;

  if (notes) msg += `*ملاحظات:*\n${notes}\n\n`;
  msg += `إجمالي الأصناف: ${idx - 1}\nشكراً لكم – بانتظار التأكيد والتوصيل 🛒`;

  return msg;
}

// إضافة صف أول تلقائي
addRow();
updateTotalWeight();

document.getElementById('orderForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!e.target.governorate.value.trim() || !e.target.customerName.value.trim()) {
    alert('يرجى تعبئة المحافظة واسم الزبون');
    return;
  }
  if (document.querySelectorAll('#itemsBody tr').length === 0) {
    alert('يجب إضافة منتج واحد على الأقل');
    return;
  }
  document.getElementById('reviewText').textContent = getOrderSummaryForDisplay();
  document.getElementById('reviewModal').style.display = 'flex';
});

document.getElementById('confirmAndSend').onclick = function() {
  document.getElementById('reviewModal').style.display = 'none';
  const msg = buildWhatsAppMessage();
  const phone = '905522221237';
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = 'جاري الإرسال...';

  fetch('https://script.google.com/macros/s/AKfycbxrpX-EdIjiMZNNQwCBnWmMBzJaSqRBY5oSIYyFV0a95kMuAco-1JHaFa3ICNbMKzPI/exec', {
    method: 'POST',
    mode: 'no-cors',
    body: new FormData(document.getElementById('orderForm'))
  }).catch(() => {
    // لا نعرض خطأ قوي لأن الواتساب فتح بالفعل
  }).finally(() => {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.textContent = 'إرسال الطلب';
    document.getElementById('orderForm').reset();
    document.getElementById('itemsBody').innerHTML = '';
    rowCounter = 0;
    addRow();
    updateTotalWeight();
  });
};

document.getElementById('cancelReview').onclick = function() {
  document.getElementById('reviewModal').style.display = 'none';
};
</script>
